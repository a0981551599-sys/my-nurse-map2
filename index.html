<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>護理小助手 Pro 🌸 專業 SOAP 生成器</title>
    <style>
        :root {
            --primary-pink: #FFB6C1;
            --secondary-pink: #FF69B4;
            --soft-blue: #B0E0E6;
            --bg-color: #FFF5F7;
            --text-color: #4A4A4A;
            --card-bg: #FFFFFF;
            --accent-color: #FF8DA1;
            --nav-width: 280px;
        }

        * { box-sizing: border-box; transition: all 0.2s ease-in-out; }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 側邊欄設計 */
        nav {
            width: var(--nav-width);
            background-color: var(--primary-pink);
            padding: 20px 10px;
            box-shadow: 4px 0 15px rgba(255, 182, 193, 0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
            overflow-y: auto;
        }

        nav h2 {
            color: white;
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .nav-group-title {
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            margin: 10px 0 5px 10px;
            opacity: 0.9;
            border-left: 3px solid white;
            padding-left: 8px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--secondary-pink);
            font-weight: 600;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .nav-btn:hover { transform: translateX(5px); background: white; }
        .nav-btn.active { background: var(--secondary-pink); color: white; }

        /* 主要內容區 */
        main {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.03);
            flex: 1;
            min-width: 350px;
        }

        .input-card { max-width: 550px; }
        .output-card { max-width: 500px; display: flex; flex-direction: column; }

        h3 { color: var(--secondary-pink); border-bottom: 2px solid #FFD1DC; padding-bottom: 10px; margin-top: 0; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group.full-width { grid-column: span 2; }
        
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: #666; }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--primary-pink); background-color: #FFF9FA; }

        .generate-btn {
            background: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 100%);
            color: white; border: none; padding: 14px; border-radius: 12px;
            width: 100%; font-size: 1rem; font-weight: bold; cursor: pointer;
            margin-top: 15px; box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
        }

        #soap-result {
            flex-grow: 1;
            background: #FDFDFD;
            padding: 15px;
            border-radius: 12px;
            white-space: pre-wrap;
            font-family: monospace;
            border: 1px solid #EEE;
            font-size: 0.9rem;
            color: #333;
            line-height: 1.5;
        }

        .copy-btn {
            background-color: var(--soft-blue); color: #4682B4; border: none;
            padding: 10px; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: bold;
        }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            nav { width: 100%; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; }
            nav h2 { display: none; }
            .nav-group-title { display: none; }
            .nav-btn { white-space: nowrap; }
            main { padding: 15px; }
            .card { min-width: 100%; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<nav id="sidebar">
    <h2>🌸 護理助手 Pro</h2>
    
    <div class="nav-group-title">常規評估</div>
    <button class="nav-btn" onclick="showForm('vital', this)">🌡️ 生命徵象</button>
    <button class="nav-btn" onclick="showForm('io_nutri', this)">🥗 排泄與營養</button>
    <button class="nav-btn" onclick="showForm('neuro', this)">🧠 意識與神智</button>
    
    <div class="nav-group-title">症狀護理</div>
    <button class="nav-btn" onclick="showForm('resp', this)">🫁 呼吸系統</button>
    <button class="nav-btn" onclick="showForm('gi', this)">🤢 腸胃系統</button>
    <button class="nav-btn" onclick="showForm('pain', this)">⚡ 疼痛評估</button>
    <button class="nav-btn" onclick="showForm('skin', this)">🩹 皮膚完整性</button>
    <button class="nav-btn" onclick="showForm('fever', this)">🔥 發燒處理</button>

    <div class="nav-group-title">處置紀錄</div>
    <button class="nav-btn" onclick="showForm('meds', this)">💊 給藥紀錄</button>
    <button class="nav-btn" onclick="showForm('tube', this)">💉 管路護理</button>
    <button class="nav-btn" onclick="showForm('exam', this)">🏥 檢查準備</button>

    <div class="nav-group-title">行政與衛教</div>
    <button class="nav-btn" onclick="showForm('edu', this)">📢 衛教與交班</button>
</nav>

<main>
    <div class="card input-card">
        <h3 id="form-title">請選擇護理項目</h3>
        <div id="dynamic-fields" class="form-grid">
            <p style="grid-column: span 2; text-align:center; color:#999; margin: 40px 0;">← 請先從左側選擇要記錄的類別</p>
        </div>
        <button id="submit-btn" class="generate-btn" style="display:none;" onclick="generateSOAP()">✨ 生成 SOAP 紀錄</button>
    </div>

    <div class="card output-card">
        <h3>📄 生成結果</h3>
        <div id="soap-result">尚未生成紀錄...</div>
        <button class="copy-btn" onclick="copyText()">📋 複製到剪貼簿</button>
    </div>
</main>

<script>
    let currentCategory = '';

    const forms = {
        vital: {
            title: "生命徵象",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 病人表示無不適' },
                { id: 'temp', label: '體溫 (℃)', type: 'number', step: '0.1', value: '36.5' },
                { id: 'hr', label: '脈搏 (次/分)', type: 'number', value: '80' },
                { id: 'rr', label: '呼吸 (次/分)', type: 'number', value: '18' },
                { id: 'bp', label: '血壓 (mmHg)', type: 'text', value: '120/80' },
                { id: 'trend', label: '數值趨勢評估 (A)', type: 'select', options: ['生命徵象穩定', '較前次上升', '較前次下降', '血壓偏高'] }
            ]
        },
        io_nutri: {
            title: "排泄與營養",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 表示想喝水、食慾正常' },
                { id: 'intake', label: '總攝入 (Intake)', type: 'text', placeholder: '如: 1500ml' },
                { id: 'output', label: '總排出 (Output)', type: 'text', placeholder: '如: 1200ml' },
                { id: 'appetite', label: '食慾/飲食量', type: 'select', options: ['正常', '佳', '欠佳', '由口進食困難', 'NPO'] },
                { id: 'stool', label: '排便情況', type: 'text', placeholder: '如: 1次/軟便' },
                { id: 'weight', label: '體重/外觀變化', type: 'text', placeholder: '如: 無水腫' }
            ]
        },
        neuro: {
            title: "意識與神智",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 能正確回答定向感問題' },
                { id: 'level', label: '意識狀態', type: 'select', options: ['Clear(清醒)', 'Drowsy(嗜睡)', 'Confusion(混淆)', 'Stupor(昏迷)', 'Coma(深昏迷)'] },
                { id: 'gcs', label: 'GCS 分數', type: 'text', value: 'E4V5M6' },
                { id: 'pupil', label: '瞳孔反應', type: 'text', value: '3.0+/3.0+' },
                { id: 'neuro_note', label: '神經學觀察', type: 'text', placeholder: '如: 四肢肌力5分' }
            ]
        },
        resp: {
            title: "呼吸系統",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 痰很多，很黏，咳不出來' },
                { id: 'spo2', label: 'SpO2 (%)', type: 'number', value: '98' },
                { id: 'rr', label: '呼吸次數', type: 'number', value: '20' },
                { id: 'cough', label: '咳嗽狀況', type: 'select', options: ['無', '偶爾咳嗽', '頻繁痰咳', '乾咳', '咳嗽無力'] },
                { id: 'sputum', label: '痰液量/色/性質', type: 'text', placeholder: '如: 黃綠色且黏稠' },
                { id: 'breath_sound', label: '呼吸音', type: 'select', options: ['Clear', 'Wheezing', 'Crackle', 'Stridor'] }
            ]
        },
        gi: {
            title: "腸胃系統",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 肚子很脹、隱隱作痛' },
                { id: 'abd_pain', label: '腹痛狀況', type: 'select', options: ['無', '輕微隱痛', '陣發性絞痛', '壓痛'] },
                { id: 'distension', label: '腹脹', type: 'select', options: ['無', '輕微', '顯著腹脹'] },
                { id: 'vomit', label: '嘔吐/腹瀉', type: 'text', placeholder: '如: 嘔吐1次/量約50cc' }
            ]
        },
        pain: {
            title: "疼痛評估",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 肚子很痛，不敢翻身' },
                { id: 'nrs', label: '疼痛分數 (NRS 0-10)', type: 'number', value: '7' },
                { id: 'nature', label: '疼痛性質與位置', type: 'text', placeholder: '如: 腹部傷口悶痛' },
                { id: 'objective_obs', label: '客觀表現 (O)', type: 'text', placeholder: '如: 表情痛苦、肢體緊繃' },
                { id: 'action', label: '處置措施', type: 'text', placeholder: '如: 依醫囑予止痛劑' }
            ]
        },
        skin: {
            title: "皮膚完整性",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 屁股皮膚刺刺痛痛的' },
                { id: 'redness', label: '紅腫/瘀斑', type: 'text', placeholder: '如: 尾骶骨微紅，指壓不退色' },
                { id: 'ulcer', label: '潰瘍/傷口', type: 'text', placeholder: '如: 足跟壓瘡2級' },
                { id: 'edema', label: '水腫情況', type: 'select', options: ['無', '1+', '2+', '3+', '4+'] }
            ]
        },
        fever: {
            title: "發燒處理",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 我好冷、全身發抖' },
                { id: 'f_temp', label: '發燒體溫', type: 'number', step: '0.1' },
                { id: 'chill', label: '畏寒/行為', type: 'select', options: ['無', '輕微', '嚴重顫抖'] },
                { id: 'f_action', label: '處置措施', type: 'text', placeholder: '如: 冰枕、Scanol 1# PO' }
            ]
        },
        meds: {
            title: "給藥紀錄",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 了解止痛藥目的' },
                { id: 'med_name', label: '特殊藥物名稱', type: 'text' },
                { id: 'med_time', label: '給藥時間', type: 'text', placeholder: '如: 09:00' },
                { id: 'med_reaction', label: '用藥後反應/評值', type: 'text', placeholder: '如: 30分鐘後疼痛減輕' }
            ]
        },
        tube: {
            title: "管路護理",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 傷口管路處無不適' },
                { id: 't_type', label: '管路種類', type: 'text', placeholder: '如: Foley, NG, CVC' },
                { id: 't_site', label: '固定深度/部位', type: 'text' },
                { id: 't_drain', label: '引流性質/量', type: 'text' }
            ]
        },
        exam: {
            title: "檢查準備",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 了解今天要做胃鏡' },
                { id: 'exam_name', label: '檢查項目', type: 'text' },
                { id: 'npo', label: '禁食狀態', type: 'select', options: ['已開始禁食', '不需禁食', '檢查後恢復飲食'] },
                { id: 'exam_note', label: '準備/術後紀錄', type: 'text', placeholder: '如: 已更換手術衣、術後回室' }
            ]
        },
        edu: {
            title: "衛教與交班",
            fields: [
                { id: 's_subjective', label: '主觀主訴 (S)', type: 'text', placeholder: '如: 不知道胰島素何時打' },
                { id: 'edu_type', label: '衛教項目/知識缺乏點', type: 'text', placeholder: '如: 糖尿病自我照護知識' },
                { id: 'edu_plan', label: '衛教計畫', type: 'text', placeholder: '如: 提供衛教單張並教導監測' },
                { id: 'handover', label: '評值結果', type: 'text', placeholder: '如: 病人能覆述正確標準' }
            ]
        }
    };

    function showForm(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const config = forms[cat];
        document.getElementById('form-title').innerText = "📝 " + config.title;
        document.getElementById('submit-btn').style.display = 'block';
        
        const container = document.getElementById('dynamic-fields');
        container.innerHTML = '';

        config.fields.forEach(field => {
            const div = document.createElement('div');
            div.className = 'form-group' + (field.type === 'textarea' ? ' full-width' : '');
            div.innerHTML = `<label>${field.label}</label>`;
            
            if(field.type === 'select') {
                let options = field.options.map(o => `<option value="${o}">${o}</option>`).join('');
                div.innerHTML += `<select id="${field.id}">${options}</select>`;
            } else {
                div.innerHTML += `<input type="${field.type}" id="${field.id}" step="${field.step || ''}" value="${field.value || ''}" placeholder="${field.placeholder || ''}">`;
            }
            container.appendChild(div);
        });
    }

    function generateSOAP() {
        let soap = "";
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

        const getV = (id) => document.getElementById(id)?.value || "未提及";

        if (currentCategory === 'vital') {
            soap = `S: "${getV('s_subjective')}"\nO: T:${getV('temp')}℃, HR:${getV('hr')}次/分, RR:${getV('rr')}次/分, BP:${getV('bp')}mmHg。\nA: ${getV('trend')}。\nP: 持續監測生命徵象並記錄趨勢變化。`;
        } 
        else if (currentCategory === 'io_nutri') {
            soap = `S: 病人自訴:"${getV('s_subjective')}"\nO: Intake:${getV('intake')}, Output:${getV('output')}, 食慾評估:${getV('appetite')}, 排便:${getV('stool')}, 身體徵象:${getV('weight')}。\nA: 營養與液體平衡狀態評估。\nP: 1. 持續紀錄I/O。 2. 必要時鼓勵少量多餐，觀察食慾改善情況。`;
        }
        else if (currentCategory === 'neuro') {
            soap = `S: 病人主訴:"${getV('s_subjective')}"\nO: 意識等級:${getV('level')}, GCS分數:${getV('gcs')}, Pupil反應:${getV('pupil')}。${getV('neuro_note')}。\nA: 神經學意識狀態觀察中。\nP: 每班執行神經學評估，觀察有無意識程度變化。`;
        }
        else if (currentCategory === 'resp') {
            soap = `S: 病人表示:"${getV('s_subjective')}"\nO: 呼吸 ${getV('rr')}次/分, SpO2 ${getV('spo2')}%, 咳嗽力道:${getV('cough')}, 呼吸音:${getV('breath_sound')}, 痰液:${getV('sputum')}。\nA: 呼吸道清除功能失效，與痰液性質及排痰能力有關。\nP: 1. 協助翻身拍痰。 2. 指導有效咳嗽及呼吸技巧。 3. 遵醫囑給予相關呼吸治療並評估效果。`;
        }
        else if (currentCategory === 'gi') {
            soap = `S: 病人表示:"${getV('s_subjective')}"\nO: 腹痛程度:${getV('abd_pain')}, 腹脹情形:${getV('distension')}, 嘔吐/腹瀉紀錄:${getV('vomit')}。\nA: 腸胃系統功能改變或不適。\nP: 1. 觀察腹部症狀與排泄性質。 2. 視需要採禁食或調整飲食。`;
        }
        else if (currentCategory === 'pain') {
            soap = `S: 病人表示:"${getV('s_subjective')}"\nO: 疼痛評分(NRS):${getV('nrs')}分, 性質位置:${getV('nature')}。表現:${getV('objective_obs')}。\nA: 急性疼痛，與組織受損或疾病過程有關。\nP: 1. 評估疼痛性質與誘發因子。 2. 指導舒適姿勢減壓。 3. ${getV('action')}。評估1小時後緩解情況。`;
        }
        else if (currentCategory === 'skin') {
            soap = `S: 病人表示:"${getV('s_subjective')}"\nO: 紅腫/瘀斑評估:${getV('redness')}, 傷口/潰瘍:${getV('ulcer')}, 水腫程度:${getV('edema')}。\nA: 皮膚完整性受損(風險)。\nP: 1. 保持皮膚乾燥清潔。 2. 定時協助翻身減壓。 3. 執行傷口護理並觀察癒合情形。`;
        }
        else if (currentCategory === 'fever') {
            soap = `S: 病人表示:"${getV('s_subjective')}"\nO: 體溫:${getV('f_temp')}℃, 畏寒表現:${getV('chill')}。\nA: 體溫過高，與發炎或感染反應有關。\nP: 1. 執行${getV('f_action')}。 2. 協助更換乾爽衣物。 3. 補充水分並於1小時後複測體溫評值。`;
        }
        else if (currentCategory === 'meds') {
            soap = `S: 病人表示:"${getV('s_subjective')}"\nO: 於${getV('med_time')}給予${getV('med_name')}。\nA: 給藥處置與反應追蹤。\nP: 評值: ${getV('med_reaction')}。`;
        }
        else if (currentCategory === 'tube') {
            soap = `S: 病人表示:"${getV('s_subjective')}"\nO: ${getV('t_type')}固定於${getV('t_site')}, 引流性質與量:${getV('t_drain')}。\nA: 管路留置狀態評估。\nP: 維持管路通暢，定期更換膠帶固定，觀察引流液變化。`;
        }
        else if (currentCategory === 'exam') {
            soap = `S: 病人表示:"${getV('s_subjective')}"\nO: 檢查項目:${getV('exam_name')}, 狀態:${getV('npo')}。\nA: 檢查前準備/後護理。\nP: 評值/進度: ${getV('exam_note')}。`;
        }
        else if (currentCategory === 'edu') {
            soap = `S: 病人表示:"${getV('s_subjective')}"\nO: 對於${getV('edu_type')}不了解。\nA: 知識缺乏，與缺乏相關照護資訊有關。\nP: 1. ${getV('edu_plan')}。 2. 評值: ${getV('handover')}。`;
        }

        document.getElementById('soap-result').innerText = `【${timeStr} 護理紀錄】\n${soap}`;
    }

    function copyText() {
        const text = document.getElementById('soap-result').innerText;
        if (text.includes("尚未")) return;
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        const btn = document.querySelector('.copy-btn');
        const oldText = btn.innerText;
        btn.innerText = "✅ 已複製！";
        setTimeout(() => btn.innerText = oldText, 2000);
    }
</script>

</body>
</html>
