<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>護理師晉升冒險地圖 🍃 動森風</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');

        :root {
            --morandi-pink: #F4C2C2;
            --mint-green: #98FF98;
            --ac-brown: #8B5E3C;
            --ac-bg: #fdf6e3;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--ac-bg);
            background-image: radial-gradient(#e5d9b6 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--ac-brown);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .ac-card {
            background: white;
            border-radius: 40px;
            border: 4px solid #f0e6cc;
            box-shadow: 0 8px 0 #e5d9b6;
        }

        .tab-btn {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 25px;
            border: 3px solid transparent;
        }
        .tab-btn.active {
            background-color: var(--morandi-pink) !important;
            color: white !important;
            border-color: #e8a5a5;
            transform: translateY(-4px);
            box-shadow: 0 6px 0 #d69595;
        }

        .goal-item {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 3px solid #f0e6cc;
            border-radius: 20px;
        }
        .goal-item.checked {
            background-color: var(--mint-green) !important;
            border-color: #7ed97e;
            color: #2d5a2d;
        }

        .map-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px;
            padding: 25px;
        }

        .tile {
            aspect-ratio: 1;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #fff;
            border: 3px solid #f0e6cc;
            box-shadow: 0 4px 0 #e5d9b6;
        }
        .tile:hover {
            transform: scale(1.1);
            background: #fffdf5;
        }
        .tile.completed {
            background-color: var(--mint-green) !important;
            border-color: #7ed97e;
            box-shadow: 0 4px 0 #6cc76c;
            color: #2d5a2d;
        }

        /* --- 懸浮小護士樣式 --- */
        .nurse-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 140px;
            z-index: 9999;
            cursor: pointer;
            animation: floating 4s ease-in-out infinite;
        }

        .nurse-wrapper {
            position: relative;
            width: 100%;
            height: auto;
        }

        .nurse-img {
            width: 100%;
            height: auto;
            display: block;
            mix-blend-mode: multiply;
            filter: drop-shadow(4px 6px 10px rgba(0,0,0,0.1));
        }

        .nurse-bubble {
            position: absolute;
            top: -65px;
            right: 10px;
            background: white;
            padding: 10px 18px;
            border-radius: 25px;
            border: 3px solid var(--morandi-pink);
            font-size: 14px;
            font-weight: 900;
            white-space: nowrap;
            box-shadow: 0 5px 0 #f0e6cc;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .nurse-container:hover .nurse-bubble,
        .nurse-bubble.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        /* --- 點擊愛心粒子樣式 --- */
        .heart-particle {
            position: fixed;
            pointer-events: none;
            z-index: 10001;
            animation: particle-fly 0.8s ease-out forwards;
            font-size: 20px;
        }

        @keyframes particle-fly {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5); opacity: 0; }
        }

        /* --- 成就勳章彈窗 --- */
        #achievement-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            z-index: 10002;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            display: none;
        }

        .medal-card {
            background: white;
            border: 10px solid var(--morandi-pink);
            border-radius: 50%;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 15px 0 #e8a5a5;
            animation: medal-bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes medal-bounce {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* --- Memo 樣式 --- */
        .memo-input {
            background: #fdf6e3;
            border: 2px dashed #e5d9b6;
            border-radius: 15px;
            width: 100%;
            padding: 12px;
            font-size: 14px;
            color: var(--ac-brown);
            resize: none;
        }
        .memo-input:focus { outline: none; border-color: var(--morandi-pink); }
    </style>
</head>
<body class="p-4 md:p-8" onclick="createHeartEffect(event)">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="ac-card p-8 mb-8 text-center md:text-left relative overflow-hidden">
            <div class="relative z-10 flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                    <h1 class="text-4xl md:text-5xl mb-2 flex items-center gap-3">
                        <span class="text-pink-400">護理晉進冒險</span> 🍃
                        <a href="https://amanhung.github.io/Formulary/" target="_blank" class="hover:scale-110 transition-transform" title="臨床藥理小實驗瓶">
                            <span class="text-3xl">🧪</span>
                        </a>
                    </h1>
                    <p class="text-gray-500 font-bold">今天也是充滿朝氣的一天呢，加油！</p>
                </div>
                
                <div class="flex gap-4">
                    <div class="bg-[#fdf6e3] px-6 py-4 rounded-[30px] border-2 border-[#e5d9b6] text-center min-w-[120px]">
                        <p id="progress-label" class="text-xs font-black mb-1 opacity-60">N1 階段進度</p>
                        <p id="total-progress-percent" class="text-3xl font-black text-pink-400">0%</p>
                    </div>
                    <div class="bg-[#fdf6e3] px-6 py-4 rounded-[30px] border-2 border-[#e5d9b6] text-center min-w-[120px]">
                        <p class="text-xs font-black mb-1 opacity-60">完成週數</p>
                        <p id="current-stage-weeks" class="text-3xl font-black text-pink-400">0</p>
                    </div>
                </div>
            </div>

            <div class="mt-8">
                <div class="w-full h-6 bg-[#f0e6cc] rounded-full p-1 shadow-inner">
                    <div id="progress-bar" class="h-full rounded-full transition-all duration-700 shadow-sm" style="width: 0%; background-color: var(--morandi-pink);"></div>
                </div>
                <div class="flex justify-between mt-2 px-2 text-xs font-black opacity-50">
                    <span id="progress-bar-title">當前階段達成率</span>
                    <span id="progress-text">0 / 52 週</span>
                </div>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="flex flex-wrap gap-3 mb-8 justify-center">
            <button onclick="switchStage(0); playSound('pop')" class="tab-btn active flex-1 py-3 bg-white text-gray-400 font-black shadow-md" id="btn-n1">N1 萌芽</button>
            <button onclick="switchStage(1); playSound('pop')" class="tab-btn flex-1 py-3 bg-white text-gray-400 font-black shadow-md" id="btn-n2">N2 成長</button>
            <button onclick="switchStage(2); playSound('pop')" class="tab-btn flex-1 py-3 bg-white text-gray-400 font-black shadow-md" id="btn-n3">N3 繁花</button>
            <button onclick="switchStage(3); playSound('pop')" class="tab-btn flex-1 py-3 bg-white text-gray-400 font-black shadow-md" id="btn-n4">N4 巔峰</button>
        </nav>

        <!-- Goals Section -->
        <div class="ac-card p-8 mb-8">
            <h2 id="stage-title" class="text-2xl font-black mb-6 flex items-center gap-2">
                <span class="p-2 bg-pink-100 rounded-xl">📋</span> 晉升條件
            </h2>
            <div id="goals-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- JS Populated -->
            </div>
        </div>

        <div class="ac-card mb-12">
            <div id="game-board" class="map-container"></div>
        </div>
    </div>

    <!-- 去背懸浮小護士助理 -->
    <div class="nurse-container" onclick="triggerNurseTalk(); playSound('ding')">
        <div id="nurse-bubble" class="nurse-bubble">今天也要加油喔！💉</div>
        <div class="nurse-wrapper">
            <img class="nurse-img" src="https://i.ibb.co/xqMkN2ZV/Gemini-Generated-Image-7071157071157071.png" alt="小護士助理">
        </div>
    </div>

    <!-- Modal -->
    <div id="overlay" class="fixed inset-0 bg-[#8B5E3C]/20 backdrop-blur-sm hidden z-40" onclick="closeModal()"></div>
    <div id="modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-sm bg-white rounded-[40px] shadow-2xl hidden z-50 p-8 border-8 border-[#f0e6cc]">
        <h2 id="modal-week-title" class="text-4xl font-black text-gray-800 mb-2">第 1 週</h2>
        <p id="modal-task-desc" class="text-gray-500 mb-4 font-medium italic">...</p>
        
        <div class="mb-6">
            <p class="text-xs font-black text-pink-400 mb-2">📒 臨床絕招 Memo</p>
            <textarea id="modal-memo" class="memo-input" rows="3" placeholder="這週學到了什麼大招？"></textarea>
        </div>

        <button id="complete-btn" onclick="toggleWeekStatus(); playSound('success')" class="w-full py-4 rounded-[25px] font-black text-white text-xl shadow-lg transform transition-transform active:scale-95">
            標記完成！
        </button>
    </div>

    <!-- 成就彈窗 -->
    <div id="achievement-overlay" onclick="this.style.display='none'">
        <div class="medal-card">
            <span class="text-6xl mb-4">🐻</span>
            <h3 class="text-3xl font-black text-pink-400">Congratulation!</h3>
            <p class="text-ac-brown font-bold mt-2">階段完美達成！</p>
        </div>
    </div>

    <script>
        const STAGE_WEEKS = 52;
        const weekStorageKey = 'ac_nursing_weeks';
        const goalStorageKey = 'ac_nursing_goals';
        const memoStorageKey = 'ac_nursing_memos';
        
        // 雲端資料同步網址 (GAS URL)
        const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbwzatD_Kd330QQqieaXNe2BeGakA66PJcgDWYMM_mtAum_rONp8XSTP7HZ_FViGcDUB9g/exec";

        let weekProgress = JSON.parse(localStorage.getItem(weekStorageKey)) || [];
        let goalProgress = JSON.parse(localStorage.getItem(goalStorageKey)) || {};
        let memoData = JSON.parse(localStorage.getItem(memoStorageKey)) || {};
        
        let currentStageIndex = 0;
        let currentEditingWeek = null;

        const stageConfig = [
            { id: 'n1', label: 'N1 萌芽', range: [1, 52], task: "熟悉環境及工作流程，能熟練執行一般病人護理。", goals: ["📖 N1在職訓練滿15小時", "📄 讀書報告/個案討論5小時", "✅ 通過讀書報告審查合格", "🧑‍⚕️ 個別護理指導實作", "🛠️ 參與管理設備、醫材"] },
            { id: 'n2', label: 'N2 成長', range: [53, 104], task: "照護重症病人，協助指導新進人員。", goals: ["📖 N2在職訓練滿15小時", "🧪 院內外學術活動滿5小時", "📝 通過案例分析或實證報告", "🏥 重症或困難病人護理", "🤝 協助指導護生或新進人員", "📊 參與護理品管活動"] },
            { id: 'n3', label: 'N3 繁花', range: [105, 156], task: "主講教育課程，獨立指導新人及執行品管。", goals: ["📖 N3在職訓練滿15小時", "🧪 院內外學術活動滿5小時", "📑 通過個案報告或實務文章", "🎤 主講教育課程/團體衛教", "🔍 獨立指導新進人員或護生", "🚩 執行護理品管活動"] },
            { id: 'n4', label: 'N4 巔峰', range: [157, 208], task: "專科進階護理，擔任組長或主持會議。", goals: ["📖 N4在職訓練滿15小時", "🧪 院內外學術活動滿5小時", "🏆 通過專案/研究/實證文章", "💎 專科領域之進階護理", "👑 獨立指導新進人員/護生", "🚩 擔任組長或主持會議"] }
        ];

        const quotes = ["今天也要加油喔！💉", "累了就休息一下吧 ☕", "妳的努力我都看見了 ✨", "深呼吸，妳做得到的！", "喝杯水，維持好心情 💧", "進度一點一滴累積中！", "別忘了對自己好一點 🌸"];

        // 雲端同步函式
        async function uploadToCloud() {
            const data = {
                weeks: localStorage.getItem(weekStorageKey),
                goals: localStorage.getItem(goalStorageKey),
                memos: localStorage.getItem(memoStorageKey),
                timestamp: new Date().toISOString()
            };

            try {
                // 使用 fetch 發送 POST 請求到 GAS
                // 註：GAS 通常需要透過 POST 且處理 CORS，如果是簡單的 doPost 應可運作
                const response = await fetch(CLOUD_API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // 避免本地端 CORS 問題，但也因此無法讀取回應狀態
                    body: JSON.stringify(data)
                });
                
                console.log("雲端同步已啟動");
                // 小護士彈出鼓勵訊息
                const bubble = document.getElementById('nurse-bubble');
                bubble.innerText = "資料已同步到雲端囉！🛡️";
                bubble.classList.add('show');
                setTimeout(() => bubble.classList.remove('show'), 3000);
            } catch (error) {
                console.error("雲端同步失敗", error);
            }
        }

        // 音效系統
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'ding') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.2);
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } else if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            }
        }

        // 點擊粒子特效
        function createHeartEffect(e) {
            const items = ['🌸', '✨', '💖', '🍀'];
            for (let i = 0; i < 6; i++) {
                const p = document.createElement('div');
                p.className = 'heart-particle';
                p.style.left = e.clientX + 'px';
                p.style.top = e.clientY + 'px';
                p.style.setProperty('--tx', (Math.random() - 0.5) * 150 + 'px');
                p.style.setProperty('--ty', (Math.random() - 0.5) * 150 + 'px');
                p.innerHTML = items[Math.floor(Math.random() * items.length)];
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        function fireConfetti() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#F4C2C2', '#98FF98', '#FFFFFF', '#FFD700'] });
        }

        function switchStage(index) {
            currentStageIndex = index;
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            const stage = stageConfig[index];
            document.getElementById('stage-title').innerHTML = `<span class="p-2 bg-pink-100 rounded-xl">📋</span> ${stage.label} 晉升條件`;
            document.getElementById('progress-label').innerText = `${stage.id.toUpperCase()} 階段進度`;
            
            const goalsList = document.getElementById('goals-list');
            goalsList.innerHTML = '';
            stage.goals.forEach((goal, gIdx) => {
                const goalId = `${stage.id}_${gIdx}`;
                const isChecked = goalProgress[goalId] || false;
                goalsList.innerHTML += `<div class="goal-item bg-white p-4 flex items-center gap-3 ${isChecked ? 'checked' : ''}" onclick="toggleGoal('${goalId}')"><span class="text-sm font-black">${goal}</span></div>`;
            });
            renderBoard();
            updateGlobalUI();
        }

        function toggleGoal(goalId) {
            goalProgress[goalId] = !goalProgress[goalId];
            localStorage.setItem(goalStorageKey, JSON.stringify(goalProgress));
            if (goalProgress[goalId]) {
                playSound('success');
                fireConfetti();
            } else {
                playSound('pop');
            }
            switchStage(currentStageIndex);
            uploadToCloud(); // 資料更動後同步
        }

        function renderBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            const stage = stageConfig[currentStageIndex];
            for (let i = stage.range[0]; i <= stage.range[1]; i++) {
                const tile = document.createElement('div');
                const isComp = weekProgress.includes(i);
                tile.className = `tile ${isComp ? 'completed' : ''}`;
                tile.innerHTML = isComp ? '🌸' : i;
                tile.onclick = (e) => {
                    e.stopPropagation();
                    playSound('pop');
                    openModal(i);
                };
                board.appendChild(tile);
            }
        }

        function openModal(week) {
            currentEditingWeek = week;
            const stage = stageConfig.find(s => week >= s.range[0] && week <= s.range[1]);
            const isComp = weekProgress.includes(week);
            
            document.getElementById('modal-week-title').innerText = `第 ${week} 週`;
            document.getElementById('modal-task-desc').innerText = stage.task;
            document.getElementById('modal-memo').value = memoData[week] || "";

            const btn = document.getElementById('complete-btn');
            btn.innerText = isComp ? '取消紀錄' : '這週達成了！';
            btn.style.backgroundColor = isComp ? '#ccc' : 'var(--morandi-pink)';
            
            document.getElementById('overlay').classList.remove('hidden');
            document.getElementById('modal').classList.remove('hidden');
        }

        function toggleWeekStatus() {
            // 儲存 Memo
            const memoVal = document.getElementById('modal-memo').value;
            if (memoVal) {
                memoData[currentEditingWeek] = memoVal;
            } else {
                delete memoData[currentEditingWeek];
            }
            localStorage.setItem(memoStorageKey, JSON.stringify(memoData));

            // 狀態切換
            if (weekProgress.includes(currentEditingWeek)) {
                weekProgress = weekProgress.filter(w => w !== currentEditingWeek);
            } else {
                weekProgress.push(currentEditingWeek);
                fireConfetti();
            }
            localStorage.setItem(weekStorageKey, JSON.stringify(weekProgress));
            
            renderBoard();
            updateGlobalUI();
            
            // 檢查是否剛達成 100%
            const stage = stageConfig[currentStageIndex];
            const compInStage = weekProgress.filter(w => w >= stage.range[0] && w <= stage.range[1]).length;
            if (compInStage === STAGE_WEEKS) {
                setTimeout(() => {
                    document.getElementById('achievement-overlay').style.display = 'flex';
                    playSound('success');
                }, 500);
            }

            closeModal();
            uploadToCloud(); // 資料更動後同步
        }

        function updateGlobalUI() {
            const stage = stageConfig[currentStageIndex];
            const compInStage = weekProgress.filter(w => w >= stage.range[0] && w <= stage.range[1]).length;
            const stagePct = ((compInStage / STAGE_WEEKS) * 100).toFixed(1);
            document.getElementById('current-stage-weeks').innerText = compInStage;
            document.getElementById('total-progress-percent').innerText = `${stagePct}%`;
            document.getElementById('progress-bar').style.width = `${stagePct}%`;
            document.getElementById('progress-text').innerText = `${compInStage} / ${STAGE_WEEKS} 週`;
        }

        function triggerNurseTalk() {
            const bubble = document.getElementById('nurse-bubble');
            bubble.innerText = quotes[Math.floor(Math.random() * quotes.length)];
            bubble.classList.add('show');
            setTimeout(() => bubble.classList.remove('show'), 3500);
        }

        function closeModal() {
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('modal').classList.add('hidden');
        }

        setInterval(triggerNurseTalk, 12000);
        function init() { switchStage(0); setTimeout(triggerNurseTalk, 1500); }
        init();
        document.getElementById('overlay').onclick = closeModal;
    </script>
</body>
</html>
